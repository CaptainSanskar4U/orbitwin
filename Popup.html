<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#020a10;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#e8f1f5}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;background:#020a10}
.a{position:absolute}
#bg{left:0;top:0;width:1672px;height:941px}
#hdr{left:0;top:0;width:1672px;height:70px;background:linear-gradient(#071621,#06121b);border-bottom:1px solid #0b1b28}
.t{position:absolute;white-space:nowrap}
.nav{font-size:11.5px;letter-spacing:3px;color:#8fa3b1;top:29px}
.sm{font-size:10.5px;letter-spacing:2.2px;color:#8fa3b1;top:29px}
.dot{border-radius:50%;background:#1fdc6c;box-shadow:0 0 6px rgba(31,220,108,.8)}
#modal{left:446px;top:202px;width:781px;height:543px;border:1px solid #2c4b63;border-radius:4px;background:linear-gradient(#08131d,#07111a);box-shadow:0 0 0 1px #03080d,0 24px 80px rgba(0,0,0,.65)}
#modal>*{position:absolute}
.lab{font-size:9px;letter-spacing:1.4px;color:#8da3b4;text-transform:uppercase}
.val{font-size:14px;font-weight:500;color:#fff;letter-spacing:.2px}
.sep{left:12px;width:194px;height:1px;background:#15293a}
.ic{width:24px;height:24px;fill:none;stroke:#8ea7ba;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.sl{width:54px;height:14px;background:repeating-linear-gradient(115deg,#2e5064 0 2px,transparent 2px 9px);opacity:.8}
#btn{left:256px;top:423px;width:267px;height:51px;border:0;border-radius:2px;background:linear-gradient(#0e72f0,#0a63de);color:#fff;font:600 14px Inter;letter-spacing:1.2px;display:flex;align-items:center;justify-content:center;gap:17px;cursor:pointer;transition:background .2s,box-shadow .2s}

#btn:hover svg{transform:translateX(4px)}#btn svg{transition:transform .2s}
#btn:focus-visible{outline:2px solid #8cc0ff;outline-offset:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{animation:sp 1s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const s=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/1672,innerHeight/941);s.style.transform=`translate(${(innerWidth-1672*k)/2}px,${(innerHeight-941*k)/2}px) scale(${k})`}

const p=n=>String(n).padStart(2,'0'),c=document.getElementById('clk');
setInterval(()=>{const d=new Date();c.textContent=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`},1000);
